<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Connecting WHOOP...</title>
  <style>
    body { background: #0d0d0d; color: #e0e0e0; font-family: 'Courier New', monospace; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; flex-direction: column; gap: 12px; }
    #status { font-size: 16px; color: #e8ff47; }
    #detail { font-size: 11px; color: #555; max-width: 500px; text-align: center; word-break: break-all; }
  </style>
</head>
<body>
  <div id="status">Connecting to WHOOP...</div>
  <div id="detail"></div>
  <script>
    const CLIENT_ID     = '8c18e31d-ba6c-414d-be83-e385ff089697';
    const CLIENT_SECRET = '51360072c1cbb3bc015746b01070373a378555df634201e6b4edc84e572d6048';
    const REDIRECT_URI  = 'http://localhost:8080/callback.html';
    const TOKEN_URL     = 'https://api.prod.whoop.com/oauth/oauth2/token';

    async function handleCallback() {
      const params = new URLSearchParams(window.location.search);
      const code  = params.get('code');
      const error = params.get('error');

      if (error) {
        document.getElementById('status').textContent = 'Authorization denied.';
        document.getElementById('detail').textContent = error;
        return;
      }
      if (!code) {
        document.getElementById('status').textContent = 'No authorization code received.';
        return;
      }

      try {
        const res = await fetch(TOKEN_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            client_id:     CLIENT_ID,
            client_secret: CLIENT_SECRET,
            code,
            redirect_uri:  REDIRECT_URI,
            grant_type:    'authorization_code',
          }),
        });

        const data = await res.json();

        if (data.access_token) {
          localStorage.setItem('whoop_tokens', JSON.stringify(data));
          localStorage.setItem('whoop_token_expiry', String(Date.now() + data.expires_in * 1000));
          document.getElementById('status').textContent = 'Connected! Returning to dashboard...';
          setTimeout(() => window.location.href = '/', 1200);
        } else {
          document.getElementById('status').textContent = 'Token exchange failed.';
          document.getElementById('detail').textContent = JSON.stringify(data);
        }
      } catch (e) {
        document.getElementById('status').textContent = 'Network error.';
        document.getElementById('detail').textContent = e.message;
      }
    }

    handleCallback();
  </script>
</body>
</html>
